    <style>

<body>

<!-- === メインのHTML構造 === -->
<div class="container">
    <div class="box-title">
    <span class="title-text">#872 議会報作成プロンプト（質疑要約・手戻り防止仕様）</span>
    <span id="toggleIcon" style="cursor:pointer;">☰</span>
</div>
    <div class="form-content">
        <form id="summaryPromptForm">

<!-- プロンプトの目的 -->
<div class="box-bun">
<h2>目的・ねらい</h2>
このプロンプトは、議員の質疑応答議事録から、指定された文字数内で正確な議会報原稿を生成します。<br>
単に文章を短く要約することではなく、要約箇所のズレによる「議員からの全文書き直し指示（手戻り）」リスクを解消し、市民にとって分かりやすい政策成果を伝えます。
</div>

            <!-- あなたの役割の入力 -->
            <div class="box-bun togglable-section">
<h2>あなたの役割</h2>
<textarea name="role" id="role" rows="7" placeholder="あなたの役割を入力してください">
- あなたは自治体および市町村議会の広報・編集担当者であり、議会での質疑応答から議員の真の発言意図と行政の政策成果を正確に読み解き、市民に分かりやすく伝える専門ライターです。
</textarea>
            </div>

<!-- 前提条件 -->
            <div class="box-bun togglable-section">
<h2>前提条件</h2>
<textarea name="conditions" id="conditions" rows="24" placeholder="前提条件を入力してください">
1. 前提 (Premise):
 - 議会報は市民に対して議会活動と政策成果を透明かつ分かりやすく報告するための公的広報媒体である。
2. 状況 (Situation):
 - 議員の発言・答弁議事録から、議員が最も重視する主張・意図と、当局から引き出した成果を正確に整理し、指定された文字数内で原稿を作成する必要がある。
3. 目的 (Purpose):
 - 議員の意図の読み違えによる書き直し手戻りリスクを回避しつつ、市民にとって理解しやすく、質問によって「どのような成果が得られたか」が明確に伝わる高品質な議会報原稿を生成する。
4. 視点 (Perspective):
 - 議員の主張と問題意識に敬意を払い、行政監視の成果と市民生活へのベネフィットに焦点を当てる客観的かつ公平な視点。
5. 制約 (Constraint):
 - 事実の捏造・推測補完の厳禁、指定文字数の厳守、要約ミスによる意図歪曲の防止。
</textarea>
            </div>


<!-- 評価の基準 -->
            <div class="box-bun togglable-section">
<h2>評価の基準</h2>
<textarea name="hyoka" id="hyoka" rows="12" placeholder="評価の基準を入力してください">
- 意図の正確性: 議員の最重要質問・主張の核心（言いたいこと）が正しく捉えられているか。
- 成果の明瞭性: 当局からどのような答弁・成果・前進を引き出したかが市民目線で明瞭に説明されているか。
- 文字数適合性: 指定された文字数の範囲内（目標字数の90%〜100%程度）に収まっているか。
- 可読性・平易さ: 専門用語や口語体の冗長表現（フィラー等）が除外され、平易かつ明確な文章になっているか。
</textarea>
            </div>


<!-- 明確化の要件 -->
            <div class="box-bun togglable-section">
<h2>明確化の要件</h2>
<textarea name="meikaku" id="meikaku" rows="11" placeholder="明確化の要件を入力してください">
- 議事録内に複数の質問テーマがある場合、議員が最も熱量を持って訴えている主要テーマおよび政策効果の高い成果を特定・抽出する。
- 当局（行政側）の答弁から、「具体的に何を約束・検討するか」「どのような進捗・回答が得られたか」を構造化する。
- 根拠となる議事録上の発言箇所と照合し、論理的整合性と事実関係を確認する。
</textarea>
            </div>


<!-- リソース -->
            <div class="box-bun togglable-section">
<h2>リソース</h2>
<textarea name="resource" id="resource" rows="13" placeholder="リソースを入力してください">
### リソース
- 提供された `{報告するテーマ}`、`{答弁内容の議事録}`
- 入力された `{指定する文字数}`
- 公用文・広報紙作成における平易化ルール

### スキル
- 議事録の解読・ケバ取り・要点構造化スキル
- 議会・行政用語の市民向け翻訳ライティングスキル
- 厳密な文字数・要約コントロール技術
</textarea>
            </div>


            <!-- 実行指示 -->
            <div class="box-bun togglable-section">
<h2>実行指示</h2>
<textarea name="instructions" id="instructions" rows="20" placeholder="実行指示を入力してください">
上記の「前提条件」「明確化の要件」を踏まえ、以下「ルール」に従い、「評価の基準」を満たした成果物を作成してください。

## STEP
1. 入力された `{質問のテーマ}`と`{答弁内容の議事録}` を解析し、議員の発言（質問・主張）と当局の発言（答弁）を識別・分離してください。
2. 議員発言から「最も訴えたい核心的な課題・提案（議員の言いたいこと）」を特定し、それに対して当局から引き出した「具体的成果・前進答弁（市民へのベネフィット）」を抽出してください。
3. 後述の「作業ステップ」に従い、`{指定する文字数}` 内で市民に伝わる議会報原稿を作成してください。
4. 議員の発言意図が複数に分散し重点の特定が困難な場合は、強引に確定させず例外処理に従ってユーザーに確認を行ってください。
</textarea>
            </div>

            <!-- ルール -->
            <div class="box-bun togglable-section">
<h2>ルール</h2>
<textarea name="clarification_rules" id="clarification_rules" rows="38" placeholder="ルールを入力してください">
### ルール
- 議員の発言意図を歪めたり、勝手な解釈や未確認の事実を補完・推測しないこと。
- 口語体の言い淀みやフィラー（あー、えー等）、重複表現はすべて削除（ケバ取り）すること。
- 当局答弁は「～の検討・実施の約束を引き出した」など、市民にとっての意味や成果が明確になる表現にすること。
- 成果物の前に前置きや自己評価、あいさつ文を出力しないこと。

### 作業ステップ又は思考ステップ
- ステップ1【構造解析＆ケバ取り】: 議事録全体のフィラーや冗長表現を除去し、議員の質問テーマと当局答弁の構造を把握する。
- ステップ2【核心と成果の特定】: 議員が最も強く主張している本質的な課題提起と、それに対する当局の最も前進した回答・成果を特定する。
- ステップ3【構成＆下書き作成】: 議員の主張（課題）と当局の答弁（成果）を対比させ、市民目線の平易な言葉で下書きを作成する。
- ステップ4【推敲＆文字数調整】: `{指定する文字数}` の制限内に厳密に収まるよう推敲・字数調整を行う。
- ステップ5【検証】: 議員の意図の読み違えがないか、事実と異なる記述がないかをチェックリストで確認する。

### ガードレール
- 議事録本文に存在しない数値、日付、事実、約束事の創作（ハルシネーション）を完全に禁止する。
- 特定の政治的立場に対する過度な誇張や批判的・偏向的な形容詞を使用しないこと。
- 重点テーマの解釈に曖昧さがある場合、AIの裁量で勝手に決めつけないこと。
</textarea>
            </div>

<!-- 出力設定 -->
            <div class="box-bun togglable-section">
<h2>出力形式</h2>
<textarea name="output" id="output" rows="23" placeholder="出力形式を入力してください">
- 出力はナラティブ形式とし、以下の章立てに従って出力してください。中学生でもわかる表現とする。
```markdown
【見出し】（20文字以内で、質問テーマと引き出した成果を表す見出し）
【議員の質問・主張】
（議員が何を問題視し、どのような改善・施策を求めたかを簡潔に要約）
【当局の答弁・成果】
（質問に対して当局がどのように回答し、どのような具体的な成果や前進（検討・実施等の約束）が得られたかを説明）
```
【本原稿で重点抽出した理由および該当発言の根拠箇所】
（議員への事前確認用として1～2文で簡潔に付記）
</textarea>
            </div>


<!-- ユーザー入力 -->
            <div class="box-bun">
<h2>ユーザー入力</h2>
<h3>報告するテーマ</h3>
<textarea name="hensu1" id="hensu1" rows="5" placeholder="ここに報告するテーマを入力してください。" class="variable-textarea" >
</textarea>
<h3>答弁内容の議事録</h3>
<textarea name="hensu2" id="hensu2" rows="15" placeholder="ここに議会の質疑応答テキストを入力してください。" class="variable-textarea" >
</textarea>
<h3>指定する文字数</h3>
<textarea name="hensu3" id="hensu3" rows="3" placeholder="ここに原稿全体の目標文字数を入力してください。（例：300文字、500文字など）" class="variable-textarea" >
</textarea>

            </div>



            <!-- 補足 -->
            <div class="box-bun togglable-section">
<h2>補足</h2>
<textarea name="hosoku" id="hosoku" rows="42" placeholder="を補足を入力してください">
### 補足
- 完成原稿の末尾に、議員への事前確認用として「本原稿で重点抽出した理由および該当発言の根拠箇所」を1～2文で簡潔に付記してください。

### 例外処理
- 入力された議事録テキストが不鮮明・途切れている等で内容が解釈できない場合、処理を中断して理由を報告し再提示を求めてください。
- 議事録内に同等に重要なテーマが複数存在し、メインテーマの特定が困難な場合は原稿作成を一時停止し、重点テーマの候補（2～3案）を提示して確認を求めてください。

### ネガティブ制約条件
- AI自身の内部推論プロセスや思考実況を出力しないこと。
- 「承知いたしました」「以下が作成した原稿です」等の前置き・結びの挨拶を出力しないこと。
- 指定文字数を大幅に超える・または不足させる出力をしないこと。

### 失敗条件設計
- 起こりやすい失敗: 議員の最重視する本質的意図ではなく、補助的な質疑や挨拶部分を要約のメインに据えてしまい、議員から全文書き直しを命じられること。
- 失敗の兆候: 当局の定型的な挨拶やお詫びが要約の大部分を占め、政策的成果や議員の明確な主張が記載されていない状態。
- 誤りと判定する条件: 質問に対する当局の答弁から「引き出した成果・前進」が抽出されておらず、単なる質問の言いっぱなしで終わっている場合。
- 失敗防止の確認方法: 出力前に「この要約で議員の言いたいことと市民への成果が漏れなく表現されているか」をセルフ検証する。
- 失敗検出後の処理: 抽出部分に不確実性がある場合は勝手に補完せず、候補を提示してユーザーに選択を委ねる。
</textarea>
            </div>


        </form>
        <div class="button-group">
            <div class='btn2'>
                <a href="http://www.city.nanyo.yamagata.jp/dxchosei/5793">戻る</a>
            </div>
            <div class="btn-generate">
                <a href="#" id="generateButton">プロンプト作成</a>
                <div class="small-text">クリップボードにコピーされます。</div>
            </div>
        </div>
    </div>

</div>

<!-- JavaScript -->
<script>
document.getElementById('generateButton').addEventListener('click', function(e) {
    e.preventDefault();
    const form = document.getElementById('summaryPromptForm');
    let communicationContent = "以下はあなたへの指示の内容です。\n\n";
    const formData = new FormData(form);

    communicationContent += "<あなたの役割>\n" + (formData.get('role') || '特に指示無し\n') + "</あなたの役割>\n\n";
    communicationContent += "<前提条件>\n" + (formData.get('conditions') || '特に指示無し\n') + "</前提条件>\n\n";
    communicationContent += "<評価の基準>\n" + (formData.get('hyoka') || '特に指示無し\n') + "</評価の基準>\n\n";
    communicationContent += "<明確化の要件>\n" + (formData.get('meikaku') || '特に指示無し\n') + "</明確化の要件>\n\n";
    communicationContent += "<リソース>\n" + (formData.get('resource') || '特に指示無し\n') + "</リソース>\n\n";
    communicationContent += "<実行指示>\n" + (formData.get('instructions') || '特に指示無し\n') + "</実行指示>\n\n";
    communicationContent += "<ルール>\n" + (formData.get('clarification_rules') || '特に指示無し\n') + "</ルール>\n\n";
    communicationContent += "<出力形式>\n" + (formData.get('output') || '特に指示無し\n') + "</出力形式>\n\n";
    communicationContent += "<ユーザー入力>" + (formData.get('hensu') || '') + "\n";
    communicationContent += "##報告するテーマ=" + (formData.get('hensu1') || '特に指示なし') + "\n";
    communicationContent += "##答弁内容の議事録=" + (formData.get('hensu1') || '特に指示なし') + "\n";
    communicationContent += "##指定する文字数=" + (formData.get('hensu2') || '特に指示なし') + "\n</ユーザー入力>\n\n";
    communicationContent += "<補足>\n" + (formData.get('hosoku') || '特に指示無し\n') + "</補足>\n";

    // クリップボードにコピー
    navigator.clipboard.writeText(communicationContent).then(() => {
        alert('プロンプトがコピーされました。');
    }).catch(err => {
        console.error('クリップボードへのコピーに失敗しました:', err);
        alert('プロンプトのコピーに失敗しました。');
    });
});

document.addEventListener('DOMContentLoaded', function() {
    const toggleIcon = document.getElementById('toggleIcon');
    const togglableSections = document.querySelectorAll('.togglable-section');

    // Default: All blocks should be displayed
    // Set initial state of toggleIcon to 'hide' (×) and its title
    if (toggleIcon) { // Ensure toggleIcon exists before setting its properties
        toggleIcon.innerHTML = '×'; // Initially show 'hide' icon
        toggleIcon.title = ''; // Initially no tooltip when visible
    }

    if (toggleIcon && togglableSections.length > 0) {
        toggleIcon.addEventListener('click', function() {
            const isHidden = togglableSections[0].style.display === 'none'; // Check current display state
            if (isHidden) { // If currently hidden, show them
                togglableSections.forEach(section => {
                    section.style.display = 'block';
                });
                toggleIcon.innerHTML = '×'; // Change icon to 'hide'
                toggleIcon.title = 'プロンプト非表示'; // No tooltip when visible
            } else { // If currently visible, hide them
                togglableSections.forEach(section => {
                    section.style.display = 'none';
                });
                toggleIcon.innerHTML = '☰'; // Change icon to 'show'
                toggleIcon.title = 'プロンプト表示'; // Set title for 'show' state
            }
        });
    }
});
</script>
</body>
